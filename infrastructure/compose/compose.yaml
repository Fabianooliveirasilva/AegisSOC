# AegisSOC core stack. S1-T12a defines postgres and redis only; edge, api and
# migrate arrive with S1-T12. Design: docs/DEPLOYMENT.md sections 2, 4, 5.
#
# Hardening (SR-23): non-root, read-only root fs + explicit tmpfs, cap_drop ALL,
# no-new-privileges, mem/pids limits, healthchecks, images pinned by digest.
# Networks (SR-24): data stores sit on an internal network and publish no port.
# Secrets (SR-16/SR-27): Docker secrets from infrastructure/compose/secrets/
# (generated by `make setup`); passwords are required on every connection.
name: aegissoc

services:
  postgres:
    # postgres:16-alpine (multi-arch index digest). Bump with Dependabot (S1-T13).
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200
    restart: unless-stopped
    networks: [app_net]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      # Password required on the local socket too (default would be trust).
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    secrets:
      - postgres_superuser_password
      - postgres_owner_password
      - postgres_app_password
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
      - /var/run/postgresql:size=1m,uid=70,gid=70,mode=0755,noexec,nosuid
    healthcheck:
      # TCP on purpose: during first-run init the temporary server listens on
      # the socket only, so this stays unhealthy until init has finished.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U aegis_app -d aegissoc",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    # redis:7.4-alpine (multi-arch index digest; D-02 Redis 7.4).
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    pids_limit: 100
    restart: unless-stopped
    networks: [app_net]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp:size=1m,uid=999,gid=999,mode=0700,noexec,nosuid
    # The password is written to a mode-600 file on tmpfs and passed as a config
    # file, so it never appears in argv or in the environment. AOF on, no
    # eviction (queued data must not be dropped silently), 256 MB cap.
    entrypoint:
      - sh
      - -c
      - |
        umask 077
        printf 'requirepass %s\n' "$$(cat /run/secrets/redis_password)" > /tmp/auth.conf
        exec redis-server /tmp/auth.conf --dir /data --appendonly yes \
          --maxmemory 256mb --maxmemory-policy noeviction --save "" \
          --protected-mode yes
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

networks:
  app_net:
    internal: true

volumes:
  pg_data:
  redis_data:

secrets:
  postgres_superuser_password:
    file: ./secrets/postgres_superuser_password
  postgres_owner_password:
    file: ./secrets/postgres_owner_password
  postgres_app_password:
    file: ./secrets/postgres_app_password
  redis_password:
    file: ./secrets/redis_password
